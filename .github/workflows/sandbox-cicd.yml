# Sandbox CI/CD pipeline for learning and end-to-end flow validation.
# Independent from upstream Filament maintenance workflows (tests.yml, etc.).
#
# Stages: lint → test → build → deploy (push to sandbox/staging/main only)
# Rollback: Actions → sandbox-cicd → Run workflow → action=rollback

name: sandbox-cicd

on:
  push:
    branches:
      - sandbox
      - staging
      - main
  pull_request:
    branches:
      - sandbox
      - staging
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Deploy action
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
      release_id:
        description: Release timestamp to roll back to (e.g. 20260702-143022). Leave empty to use the previous release.
        required: false
        type: string
      dry_run:
        description: Skip SSH deploy; only validate the pipeline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sandbox-cicd-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.action || 'pipeline' }}
  cancel-in-progress: ${{ github.event.inputs.action != 'rollback' }}

env:
  PHP_VERSION: '8.4'
  LARAVEL_VERSION: '12.*'
  TESTBENCH_VERSION: '10.*'

jobs:
  lint:
    if: github.event.inputs.action != 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.composer/cache/files
          key: sandbox-composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            sandbox-composer-${{ env.PHP_VERSION }}-

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ env.LARAVEL_VERSION }}" "orchestra/testbench:${{ env.TESTBENCH_VERSION }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test --cache-file=.pint.cache

  test:
    if: github.event.inputs.action != 'rollback'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.composer/cache/files
          key: sandbox-composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            sandbox-composer-${{ env.PHP_VERSION }}-

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ env.LARAVEL_VERSION }}" "orchestra/testbench:${{ env.TESTBENCH_VERSION }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxkbcommon0 libpango-1.0-0 libcairo2 libasound2t64

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Cache Blade views
        run: ./vendor/bin/testbench view:cache

      - name: Run tests (SQLite, parallel)
        run: ./vendor/bin/pest --configuration=phpunit.sqlite.xml --parallel --exclude-group=commands

      - name: Run command tests (serial)
        run: ./vendor/bin/pest --configuration=phpunit.sqlite.xml --group=commands

  build:
    if: github.event.inputs.action != 'rollback'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-build-${{ github.sha }}
          path: |
            packages/**/dist/**
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: |
      github.event.inputs.action != 'rollback' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(fromJSON('["refs/heads/sandbox", "refs/heads/staging", "refs/heads/main"]'), github.ref)
      )
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'sandbox') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a917ee6bf8e2b2005df0e2d355bfc83a12a # v4.1.8
        with:
          name: sandbox-build-${{ github.sha }}
          path: .

      - name: Prepare release archive
        run: |
          RELEASE_ID="$(date -u +%Y%m%d-%H%M%S)"
          echo "RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"
          echo "Deploying release ${RELEASE_ID} from commit ${GITHUB_SHA}"

          mkdir -p "release/${RELEASE_ID}"
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='docs-assets' \
            --exclude='docs' \
            --exclude='release' \
            ./ "release/${RELEASE_ID}/"

      - name: Dry run (skip SSH)
        if: github.event.inputs.dry_run == true
        run: |
          echo "::notice::Dry run enabled — SSH deploy skipped."
          echo "Release ID: ${RELEASE_ID}"
          echo "Target path: ${{ secrets.DEPLOY_PATH }}"
          echo "Target host: ${{ secrets.SSH_HOST }}"

      - name: Upload deploy scripts
        if: github.event.inputs.dry_run != true
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: scripts/cicd/*
          target: ${{ secrets.DEPLOY_PATH }}/scripts/cicd
          overwrite: true

      - name: Upload release archive
        if: github.event.inputs.dry_run != true
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: release/${{ env.RELEASE_ID }}
          target: ${{ secrets.DEPLOY_PATH }}/incoming

      - name: Activate release on server
        if: github.event.inputs.dry_run != true
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            RELEASE_ID="${{ env.RELEASE_ID }}"
            chmod +x "${DEPLOY_PATH}/scripts/cicd/"*.sh
            bash "${DEPLOY_PATH}/scripts/cicd/release-deploy.sh" "${RELEASE_ID}"

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Sandbox deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Action | deploy |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Release | \`${{ env.RELEASE_ID || 'n/a' }}\` |"
            echo "| Actor | @${{ github.actor }} |"
            echo "| Dry run | ${{ github.event.inputs.dry_run || 'false' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  rollback:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'sandbox') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Dry run (skip SSH)
        if: github.event.inputs.dry_run == true
        run: |
          echo "::notice::Dry run enabled — rollback skipped."
          echo "Release ID: ${{ github.event.inputs.release_id || 'previous' }}"

      - name: Upload deploy scripts
        if: github.event.inputs.dry_run != true
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: scripts/cicd/*
          target: ${{ secrets.DEPLOY_PATH }}/scripts/cicd
          overwrite: true

      - name: Roll back on server
        if: github.event.inputs.dry_run != true
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            RELEASE_ID="${{ github.event.inputs.release_id }}"
            chmod +x "${DEPLOY_PATH}/scripts/cicd/"*.sh
            bash "${DEPLOY_PATH}/scripts/cicd/release-rollback.sh" "${RELEASE_ID}"

      - name: Write rollback summary
        if: always()
        run: |
          {
            echo "## Sandbox rollback"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Action | rollback |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Release | \`${{ github.event.inputs.release_id || 'previous' }}\` |"
            echo "| Actor | @${{ github.actor }} |"
            echo "| Dry run | ${{ github.event.inputs.dry_run || 'false' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
